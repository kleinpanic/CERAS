name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libx11-dev libxrandr-dev libasound2-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libavdevice-dev libswresample-dev
      - run: make
